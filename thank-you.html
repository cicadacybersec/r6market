<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Thank You - SiegeVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Barlow', sans-serif;
            background-color: #080808;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background-color: #0f0f0f;
            border-top: 3px solid #E8281A;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 36px;
            color: #E8281A;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p {
            font-family: 'Barlow', sans-serif;
            font-weight: 400;
            font-size: 18px;
            color: #C0C0C0;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .cta-button {
            background-color: #E8281A;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 40px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .cta-button:hover {
            background-color: #b31f14;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(232,40,26,0.15);
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }
            p {
                font-size: 16px;
            }
            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>REQUEST RECEIVED</h1>
        <p>Your submission has been logged. A member of the SiegeVault team will respond shortly.</p>
        <a href="/" class="cta-button">RETURN TO SITE</a>
    </div>
</body>
</html>
